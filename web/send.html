<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FSK Send</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="app-header">
      <div class="icon">📤</div>
      <div>
        <h1>FSK Send</h1>
        <p>Encode a file as audio and play it out loud</p>
      </div>
    </div>

    <div class="panel">
      <label class="dropzone" id="dropzone">
        <div class="dz-icon">📄</div>
        <div>Click to choose a file, or drag one here</div>
        <div style="font-size:12px; margin-top:4px;">Supports all small binary files up to 2 KB (.png, .pdf, .txt, .bin, etc.)</div>
        <input type="file" id="fileInput" />
      </label>

      <div class="file-chip" id="fileChip">
        <span class="name" id="fileName"></span>
        <span class="size" id="fileSize"></span>
        <span class="remove" id="removeFile">✕</span>
      </div>

      <button class="btn-primary" id="sendBtn" disabled>Play / Send</button>
      <div class="status-line">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Choose a file to begin (max 2 KB).</span>
      </div>
    </div>

    <a class="nav-link" href="receive.html">Go to Receive app →</a>
  </div>

  <script src="encoder/encoder.js?v=2.1"></script>
  <script src="shared/fsk-helpers.js?v=2.1"></script>
  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const fileChip = document.getElementById('fileChip');
    const fileNameEl = document.getElementById('fileName');
    const fileSizeEl = document.getElementById('fileSize');
    const removeFile = document.getElementById('removeFile');
    const sendBtn = document.getElementById('sendBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    let selectedFile = null;
    const MAX_FILE_SIZE_BYTES = 2048; // 2 KB maximum for 50 baud acoustic transfer

    function setStatus(text, state) {
      statusText.textContent = text;
      statusDot.className = 'status-dot' + (state ? ' ' + state : '');
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function onFileChosen(file) {
      if (file.size > MAX_FILE_SIZE_BYTES) {
        selectedFile = null;
        fileInput.value = '';
        fileChip.classList.remove('visible');
        sendBtn.disabled = true;
        setStatus('❌ File too large (' + formatSize(file.size) + '). Maximum size for 50 baud audio is 2 KB.', 'bad');
        alert('⚠️ File Too Large (' + formatSize(file.size) + ')\n\nFSK Audio File Transfer operates at 50 baud (50 bits/sec).\n\nAt 50 baud, a 1 KB file takes ~3.3 minutes to transmit, and larger files (like standard PDFs/images) require gigabytes of browser RAM for audio buffers.\n\nPlease choose a file smaller than 2 KB (e.g., small .txt, tiny icon, or short binary snippet).');
        return;
      }

      selectedFile = file;
      fileNameEl.textContent = file.name;
      fileSizeEl.textContent = formatSize(file.size);
      fileChip.classList.add('visible');
      sendBtn.disabled = false;
      setStatus('Ready to send "' + file.name + '" (' + formatSize(file.size) + ').');
    }

    dropzone.addEventListener('click', (e) => {
      if (e.target === removeFile) return;
      fileInput.click();
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) onFileChosen(fileInput.files[0]);
    });

    ['dragover', 'dragenter'].forEach(evt =>
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.add('drag-over');
      })
    );
    ['dragleave', 'drop'].forEach(evt =>
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.remove('drag-over');
      })
    );
    dropzone.addEventListener('drop', (e) => {
      if (e.dataTransfer.files[0]) onFileChosen(e.dataTransfer.files[0]);
    });

    removeFile.addEventListener('click', (e) => {
      e.stopPropagation();
      selectedFile = null;
      fileInput.value = '';
      fileChip.classList.remove('visible');
      sendBtn.disabled = true;
      setStatus('Choose a file to begin.');
    });

    sendBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      sendBtn.disabled = true;
      setStatus('Reading file...', 'active');

      try {
        const buffer = await selectedFile.arrayBuffer();
        const payloadBytes = new Uint8Array(buffer);
        setStatus('Encoding + playing "' + selectedFile.name + '"...', 'active');
        await FSKHelpers.playPacket(payloadBytes, selectedFile.name);

        setStatus('Done. Sent "' + selectedFile.name + '".', 'good');
      } catch (err) {
        console.error(err);
        setStatus('Error: ' + err.message, 'bad');
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
