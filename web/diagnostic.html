<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FSK Loopback Diagnostic</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="app-header">
      <div class="icon">🔬</div>
      <div>
        <h1>Loopback Diagnostic</h1>
        <p>Encodes then decodes entirely in memory — no speaker/mic involved</p>
      </div>
    </div>

    <div class="panel">
      <input class="field" id="testText" value="Hello World, this is a test." />
      <button class="btn-primary" id="runBtn">Run Software Loopback Test</button>
      <div class="output-box" id="log">Click the button to run the test.</div>
    </div>
  </div>

  <script src="encoder/encoder.js?v=2.1"></script>
  <script src="decoder/decoder.js?v=2.1"></script>
  <script src="shared/fsk-helpers.js?v=2.1"></script>
  <script>
  (function () {
    const logEl = document.getElementById('log');
    function log(msg) {
      logEl.textContent += (logEl.textContent ? '\n' : '') + msg;
      logEl.classList.add('has-content');
    }

    const SPEC = window.FSKEncoder.SPEC;
    const SAMPLES_PER_BIT = Math.round(SPEC.SAMPLE_RATE / SPEC.BAUD_RATE);

    function goertzel(samples, targetFreq, sampleRate) {
      const N = samples.length;
      const k = Math.round((N * targetFreq) / sampleRate);
      const omega = (2.0 * Math.PI * k) / N;
      const coeff = 2.0 * Math.cos(omega);
      let s_prev = 0, s_prev2 = 0;
      for (let i = 0; i < N; i++) {
        const s = samples[i] + coeff * s_prev - s_prev2;
        s_prev2 = s_prev; s_prev = s;
      }
      return s_prev2 * s_prev2 + s_prev * s_prev - coeff * s_prev * s_prev2;
    }

    function detectBit(samples) {
      const eSpace = goertzel(samples, SPEC.SPACE_FREQ, SPEC.SAMPLE_RATE);
      const eMark  = goertzel(samples, SPEC.MARK_FREQ,  SPEC.SAMPLE_RATE);
      const maxEnergy = Math.max(eSpace, eMark);
      return { bit: eMark > eSpace ? 1 : 0, isSilence: maxEnergy < 1.0 };
    }

    function detectPostamble(samples) {
      const eP = goertzel(samples, SPEC.POSTAMBLE_FREQ, SPEC.SAMPLE_RATE);
      const eS = goertzel(samples, SPEC.SPACE_FREQ,     SPEC.SAMPLE_RATE);
      const eM = goertzel(samples, SPEC.MARK_FREQ,      SPEC.SAMPLE_RATE);
      return eP > eS * 2 && eP > eM * 2 && eP > 5.0;
    }

    function decodeFullSampleBuffer(samples) {
      let bitBuffer = [];
      let preambleDetected = false, lastBit = -1, altCount = 0;
      let postambleStreak = 0;
      const PREAMBLE_THRESHOLD = SPEC.PREAMBLE_THRESHOLD;
      let i = 0;

      while (i + SAMPLES_PER_BIT <= samples.length) {
        const windowSamples = samples.subarray(i, i + SAMPLES_PER_BIT);
        i += SAMPLES_PER_BIT;

        if (preambleDetected && detectPostamble(windowSamples)) {
          postambleStreak++;
          if (postambleStreak >= 2) {
            return window.FSKDecoder.decodeBitsToBytes(bitBuffer);
          }
          continue;
        } else {
          postambleStreak = 0;
        }

        const { bit, isSilence } = detectBit(windowSamples);

        if (!preambleDetected) {
          if (lastBit === -1) { lastBit = bit; altCount = 1; }
          else if (bit !== lastBit) {
            altCount++; lastBit = bit;
            if (altCount >= PREAMBLE_THRESHOLD) {
              preambleDetected = true;
              bitBuffer = [];
              log('Preamble detected after ' + altCount + ' alternating windows.');
            }
          } else { altCount = 1; lastBit = bit; }
        } else {
          if (isSilence && bitBuffer.length === 0) continue;
          bitBuffer.push(bit);
        }
      }
      return window.FSKDecoder.decodeBitsToBytes(bitBuffer);
    }

    document.getElementById('runBtn').addEventListener('click', () => {
      logEl.textContent = '';
      const text = document.getElementById('testText').value || "Hello World";
      const filename = 'diagnostic_test.txt';

      log('--- Protocol Spec ---');
      log(`Baud: ${SPEC.BAUD_RATE} baud (${SPEC.BIT_DURATION_SEC * 1000}ms/bit) | Freq: ${SPEC.SPACE_FREQ}/${SPEC.MARK_FREQ} Hz | Sample Rate: ${SPEC.SAMPLE_RATE} Hz`);
      log(`Preamble threshold: ${SPEC.PREAMBLE_THRESHOLD} windows | Postamble: ${SPEC.POSTAMBLE_FREQ} Hz`);

      // Test 1: CRC-8 standard test vector
      const testVector = new TextEncoder().encode("123456789");
      const crcResult = window.FSKEncoder.crc8(testVector);
      log(`\n1. CRC-8 Test Vector ("123456789"): Expected 0xF4, Got 0x${crcResult.toString(16).toUpperCase()} -> ${crcResult === 0xF4 ? '✅ PASS' : '❌ FAIL'}`);

      // Test 2: Audio Loopback for user text
      log('\n2. Software Audio Loopback (Text Payload):');
      log('Encoding text "' + text + '" as "' + filename + '"...');

      const samples = window.FSKHelpers.packetToAudioSamples(text, filename);
      log('Generated ' + samples.length + ' audio samples (' + (samples.length / SPEC.SAMPLE_RATE).toFixed(2) + 's).');

      log('Demodulating samples in memory...');
      const bytes = decodeFullSampleBuffer(samples);
      log('Decoded ' + bytes.length + ' raw bytes.');

      const packet = window.FSKDecoder.parsePacket(bytes);
      if (packet.error || !packet.valid) {
        log('❌ FAILED: ' + packet.error);
      } else {
        const decodedText = new TextDecoder("utf-8").decode(packet.payloadBytes);
        log('✅ SUCCESS');
        log('Filename: ' + packet.filename);
        log('File size: ' + packet.fileSize + ' bytes');
        log('File type: ' + packet.fileType);
        log('Payload: "' + decodedText + '"');
        log('Matches original: ' + (decodedText === text ? '✅ YES' : '❌ NO'));
      }

      // Test 3: Binary Payload Loopback
      log('\n3. Software Audio Loopback (Raw Binary Bytes Payload):');
      const binaryData = new Uint8Array([0x00, 0x01, 0x02, 0x7F, 0x80, 0xFE, 0xFF, 0x42]);
      const binFilename = 'test_data.bin';
      log(`Encoding ${binaryData.length} binary bytes...`);

      const binSamples = window.FSKHelpers.packetToAudioSamples(binaryData, binFilename);
      const binBytes = decodeFullSampleBuffer(binSamples);
      const binPacket = window.FSKDecoder.parsePacket(binBytes);

      if (binPacket.error || !binPacket.valid) {
        log('❌ FAILED Binary Loopback: ' + binPacket.error);
      } else {
        let match = binPacket.payloadBytes.length === binaryData.length;
        if (match) {
          for (let k = 0; k < binaryData.length; k++) {
            if (binPacket.payloadBytes[k] !== binaryData[k]) {
              match = false;
              break;
            }
          }
        }
        log(`✅ BINARY LOOPBACK SUCCESS: Byte-for-byte equality -> ${match ? '✅ MATCH' : '❌ MISMATCH'}`);
      }
    });

  })();
  </script>
</body>
</html>
