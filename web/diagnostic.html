<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FSK Loopback Diagnostic</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="app-header">
      <div class="icon">🔬</div>
      <div>
        <h1>Loopback Diagnostic</h1>
        <p>Encodes then decodes entirely in memory — no speaker/mic involved</p>
      </div>
    </div>

    <div class="panel">
      <input class="field" id="testText" value="Hello World, this is a test." />
      <button class="btn-primary" id="runBtn">Run Software Loopback Test</button>
      <div class="output-box" id="log">Click the button to run the test.</div>
    </div>
  </div>

  <script src="encoder/encoder.js"></script>
  <script src="shared/fsk-helpers.js"></script>
  <script>
  (function () {
    const logEl = document.getElementById('log');
    function log(msg) {
      logEl.textContent += '\n' + msg;
      logEl.classList.add('has-content');
    }

    const LOCAL_SPEC = window.FSKEncoder.SPEC;
    const SAMPLES_PER_BIT = Math.round(LOCAL_SPEC.SAMPLE_RATE / LOCAL_SPEC.BAUD_RATE);

    function goertzel(samples, targetFreq, sampleRate) {
      const N = samples.length;
      const k = Math.round((N * targetFreq) / sampleRate);
      const omega = (2.0 * Math.PI * k) / N;
      const coeff = 2.0 * Math.cos(omega);
      let s_prev = 0, s_prev2 = 0;
      for (let i = 0; i < N; i++) {
        const s = samples[i] + coeff * s_prev - s_prev2;
        s_prev2 = s_prev; s_prev = s;
      }
      return s_prev2 * s_prev2 + s_prev * s_prev - coeff * s_prev * s_prev2;
    }

    function detectBit(samples) {
      const eSpace = goertzel(samples, LOCAL_SPEC.SPACE_FREQ, LOCAL_SPEC.SAMPLE_RATE);
      const eMark = goertzel(samples, LOCAL_SPEC.MARK_FREQ, LOCAL_SPEC.SAMPLE_RATE);
      return eMark > eSpace ? 1 : 0;
    }

    function detectPostamble(samples) {
      const eP = goertzel(samples, LOCAL_SPEC.POSTAMBLE_FREQ, LOCAL_SPEC.SAMPLE_RATE);
      const eS = goertzel(samples, LOCAL_SPEC.SPACE_FREQ, LOCAL_SPEC.SAMPLE_RATE);
      const eM = goertzel(samples, LOCAL_SPEC.MARK_FREQ, LOCAL_SPEC.SAMPLE_RATE);
      return eP > eS * 2 && eP > eM * 2;
    }

    function decodeBitsToBytes(bits) {
      let bytes = [], i = 0;
      while (i < bits.length - 9) {
        if (bits[i] !== 0) { i++; continue; }
        if (i + 9 >= bits.length) break;
        let byteVal = 0;
        for (let b = 0; b < 8; b++) byteVal = (byteVal << 1) | bits[i + 1 + b];
        if (bits[i + 9] === 1) { bytes.push(byteVal); i += 10; } else { i++; }
      }
      return bytes;
    }

    function crc8(dataArray) {
      let crc = 0;
      for (let i = 0; i < dataArray.length; i++) {
        crc ^= dataArray[i];
        for (let j = 0; j < 8; j++) {
          crc = (crc & 0x80) ? ((crc << 1) ^ 0x07) : (crc << 1);
          crc &= 0xFF;
        }
      }
      return crc;
    }

    function parsePacket(bytes) {
      if (bytes.length < 13) return { error: "Packet too small" };
      let offset = 0;
      const filenameLength = bytes[offset++];
      let filename = '';
      for (let i = 0; i < filenameLength; i++) filename += String.fromCharCode(bytes[offset++]);
      const fileSize = (bytes[offset++] << 24) | (bytes[offset++] << 16) | (bytes[offset++] << 8) | bytes[offset++];
      let fileType = '';
      for (let i = 0; i < 8; i++) { const c = bytes[offset++]; if (c !== 0) fileType += String.fromCharCode(c); }
      const payloadEnd = offset + fileSize;
      const payloadBytes = bytes.slice(offset, payloadEnd);
      let payloadText = '';
      for (let i = 0; i < payloadBytes.length; i++) payloadText += String.fromCharCode(payloadBytes[i]);
      offset = payloadEnd;
      const receivedChecksum = bytes[offset];
      const calculated = crc8(bytes.slice(0, offset));
      if (calculated !== receivedChecksum) {
        return { error: `CRC mismatch (expected 0x${calculated.toString(16)}, got 0x${receivedChecksum.toString(16)})` };
      }
      return { filename, fileSize, fileType, payloadText, valid: true };
    }

    function decodeFullSampleBuffer(samples) {
      let bitBuffer = [];
      let preambleDetected = false, lastBit = -1, altCount = 0;
      let postambleStreak = 0;
      const PREAMBLE_THRESHOLD = 18;
      let i = 0;

      while (i + SAMPLES_PER_BIT <= samples.length) {
        const window = samples.subarray(i, i + SAMPLES_PER_BIT);
        i += SAMPLES_PER_BIT;

        if (preambleDetected && detectPostamble(window)) {
          postambleStreak++;
          if (postambleStreak >= 2) {
            return decodeBitsToBytes(bitBuffer);
          }
          continue;
        } else {
          postambleStreak = 0;
        }

        const bit = detectBit(window);

        if (!preambleDetected) {
          if (lastBit === -1) { lastBit = bit; altCount = 1; }
          else if (bit !== lastBit) {
            altCount++; lastBit = bit;
            if (altCount >= PREAMBLE_THRESHOLD) { preambleDetected = true; bitBuffer = []; log('Preamble detected after ' + altCount + ' windows.'); }
          } else { altCount = 1; lastBit = bit; }
        } else {
          bitBuffer.push(bit);
        }
      }
      return decodeBitsToBytes(bitBuffer);
    }

    document.getElementById('runBtn').addEventListener('click', () => {
      logEl.textContent = '';
      const text = document.getElementById('testText').value;
      const filename = 'test.txt';

      log('SPEC in use: ' + JSON.stringify(LOCAL_SPEC));
      log('Encoding "' + text + '" as "' + filename + '"...');

      const samples = window.FSKHelpers.packetToAudioSamples(text, filename);
      log('Generated ' + samples.length + ' audio samples (' + (samples.length / LOCAL_SPEC.SAMPLE_RATE).toFixed(2) + 's).');

      log('Decoding purely in memory (no mic/speaker)...');
      const bytes = decodeFullSampleBuffer(samples);
      log('Decoded ' + bytes.length + ' raw bytes.');

      const packet = parsePacket(bytes);
      if (packet.error) {
        log('❌ FAILED: ' + packet.error);
      } else {
        log('✅ SUCCESS');
        log('Filename: ' + packet.filename);
        log('File size: ' + packet.fileSize);
        log('File type: ' + packet.fileType);
        log('Payload: "' + packet.payloadText + '"');
        log('Matches original: ' + (packet.payloadText === text));
      }
    });

  })();
  </script>
</body>
</html>
