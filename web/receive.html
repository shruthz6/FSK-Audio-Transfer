<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FSK Receive</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="app-header">
      <div class="icon">📥</div>
      <div>
        <h1>FSK Receive</h1>
        <p>Listen for audio and decode it back into a file</p>
      </div>
    </div>

    <div class="panel">
      <div class="btn-row">
        <button class="btn-secondary" id="start-btn">🎙️ Start Listening</button>
        <button class="btn-secondary" id="stop-btn" disabled>⏹ Stop</button>
      </div>
      <div class="btn-row">
        <button class="btn-secondary" id="clear-btn">Clear</button>
        <button class="btn-secondary" id="selftest-btn">Run Self-Test</button>
      </div>

      <div class="status-line">
        <span class="status-dot" id="status-dot-visual"></span>
        <span id="status">Idle. Click "Start Listening" to begin.</span>
      </div>
      <div class="status-line" id="bit-count"></div>

      <div class="output-box" id="decoded-output">(nothing decoded yet)</div>

      <button class="btn-primary" id="downloadBtn" style="display:none;">⬇ Download decoded file</button>
    </div>

    <a class="nav-link" href="send.html">← Go to Send app</a>
  </div>

  <script src="decoder/decoder.js?v=2.1"></script>
  <script>
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const clearBtn = document.getElementById('clear-btn');
    const selfTestBtn = document.getElementById('selftest-btn');
    const statusDotVisual = document.getElementById('status-dot-visual');
    const statusEl = document.getElementById('status');
    const outputBox = document.getElementById('decoded-output');
    const downloadBtn = document.getElementById('downloadBtn');

    let lastDecodedPacket = null;

    const statusObserver = new MutationObserver(() => {
      const msg = statusEl.textContent;
      statusDotVisual.className = 'status-dot';
      if (msg.includes('Listening')) statusDotVisual.classList.add('active');
      else if (msg.includes('Received') || msg.includes('complete') || msg.includes('File received')) statusDotVisual.classList.add('good');
      else if (msg.includes('failed') || msg.includes('error') || msg.includes('Error') || msg.includes('corrupted') || msg.includes('No signal')) statusDotVisual.classList.add('bad');
    });
    statusObserver.observe(statusEl, { childList: true, characterData: true, subtree: true });

    function handlePacketDecoded(packet) {
      if (!packet || !packet.valid || packet.error) {
        statusEl.textContent = '❌ Transfer failed — data corrupted, please try again';
        statusDotVisual.className = 'status-dot bad';
        outputBox.textContent = '⚠️ Transfer failed — data corrupted, please try again';
        outputBox.classList.add('has-content');
        downloadBtn.style.display = 'none';
        lastDecodedPacket = null;
        return;
      }

      lastDecodedPacket = packet;
      statusEl.textContent = `✅ Received file "${packet.filename}" (${packet.fileSize} bytes)`;
      statusDotVisual.className = 'status-dot good';

      let previewText = `Filename: ${packet.filename}\nSize: ${packet.fileSize} bytes\nType: ${packet.fileType || 'bin'}\nCRC-8: Verified ✅`;

      try {
        const text = new TextDecoder('utf-8', { fatal: true }).decode(packet.payloadBytes);
        if (/^[\x20-\x7E\s\r\n]*$/.test(text)) {
          previewText += `\n\n--- Content Preview ---\n${text}`;
        }
      } catch (e) {
        previewText += `\n\n[Binary content — ${packet.fileSize} bytes]`;
      }

      outputBox.textContent = previewText;
      outputBox.classList.add('has-content');
      downloadBtn.style.display = 'block';
    }

    if (window.FSKDecoder) {
      window.FSKDecoder.onPacketDecoded = handlePacketDecoded;
    }

    startBtn.addEventListener('click', startListening);
    stopBtn.addEventListener('click', stopListening);
    clearBtn.addEventListener('click', () => {
      clearOutput();
      downloadBtn.style.display = 'none';
      lastDecodedPacket = null;
      outputBox.classList.remove('has-content');
    });
    selfTestBtn.addEventListener('click', runSelfTest);

    downloadBtn.addEventListener('click', () => {
      if (!lastDecodedPacket || !lastDecodedPacket.payloadBytes) return;

      let mimeType = 'application/octet-stream';
      const ext = (lastDecodedPacket.fileType || '').toLowerCase().trim();
      if (ext === 'txt') mimeType = 'text/plain;charset=utf-8';
      else if (ext === 'png') mimeType = 'image/png';
      else if (ext === 'jpg' || ext === 'jpeg') mimeType = 'image/jpeg';
      else if (ext === 'pdf') mimeType = 'application/pdf';
      else if (ext === 'json') mimeType = 'application/json';
      else if (ext === 'html') mimeType = 'text/html';

      const blob = new Blob([lastDecodedPacket.payloadBytes], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = lastDecodedPacket.filename || ('decoded.' + (ext || 'bin'));
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
